name: Build (Windows/Linux/macOS)

on:
  push:
    branches:
      - main
    tags:
      - '**'
  # All submodules are public, so the default GITHUB_TOKEN checks them out.
  # PRs are still expected from same-repo branches: a fork PR gets a read-only
  # GITHUB_TOKEN, so the ghcr.io build-cache pushes (cache-to) are refused.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/unitystack
  CACHE_IMAGE_NAME: desktopeditors-build-cache
  BUILD_NUMBER: dev.1
  BUILD_ROOT: /package
  # Azure Artifact Signing (sign-windows). Repository variables override these.
  ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT || 'https://neu.codesigning.azure.net' }}
  ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT || 'unitystackcodesign' }}
  ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE || 'unitystack' }}
  ARTIFACT_SIGNING_CLIENT_VERSION: 1.0.146   # NuGet Microsoft.ArtifactSigning.Client

# ─────────────────────────────────────────────────────────────
# BRANDING
#
# This fork builds only the euro-office brand. Same mechanism as
# DocumentServer: a brand repo can be checked out into
# build/brands/<brand> (inside the docker build context, which is the
# repo root for every bake target here), and the bake graph is told
# about it through three variables that the existing docker-bake.hcl
# files already declare:
#
#   BRANDING_DIR   path (relative to the repo root) whose
#                  desktop-apps/package/ tree is overlaid on top of
#                  the upstream packaging tree in
#                  build/.docker/packages.bake.Dockerfile
#   COMPANY_NAME   drives COMPANY_NAME_LOW, the package/output names
#   PRODUCT_NAME   display name baked into the packages
#
# Because those are HCL `variable` blocks, setting them as env vars on
# the bake step is enough — no brand .hcl file is strictly required.
# The extra_bake_files_* / extra_targets_* matrix slots are kept so a
# brand-desktop.hcl from the brand repo can be layered on later
# exactly the way brand-server.hcl is in DocumentServer (e.g. to
# override a `brand-icons` target).
# ─────────────────────────────────────────────────────────────

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      product_version:      ${{ steps.meta.outputs.product_version }}
      build_number:         ${{ steps.meta.outputs.build_number }}
      ref_name:             ${{ steps.meta.outputs.ref_name }}
      sha_short:            ${{ steps.meta.outputs.sha_short }}
    steps:
      # Shallow, no submodules — this job only needs the VERSION file.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false

      - name: Compute version
        id: meta
        run: |
          REF_NAME=$(echo "$GITHUB_REF_NAME" | tr '/' '-')
          echo "ref_name=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

          IS_TAG=${{ startsWith(github.ref, 'refs/tags/') }}

          # Parse PRODUCT_VERSION / BUILD_NUMBER from the git tag.
          # Supported formats:
          #   v9.3.1-rc.1  → product_version=9.3.1  build_number=0~rc.1
          #   v9.3.1       → product_version=9.3.1  build_number=0
          #   v9.3.1-1     → product_version=9.3.1  build_number=1
          # The "0~" prefix sorts a prerelease before the final release
          # (9.3.1-0~rc.1 < 9.3.1-0) in both dpkg and rpm; a patch build
          # sorts after it (9.3.1-0 < 9.3.1-1).
          # Fall back to the VERSION file for non-tag builds.
          if [[ "$IS_TAG" == "true" && "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([1-9][0-9]*)$ ]]; then
            echo "product_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "build_number=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
          elif [[ "$IS_TAG" == "true" && "$GITHUB_REF_NAME" =~ ^v([^-]+)-(.+)$ ]]; then
            echo "product_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "build_number=0~${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
          elif [[ "$IS_TAG" == "true" && "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "product_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "build_number=0" >> $GITHUB_OUTPUT
          elif [[ "$IS_TAG" == "true" ]]; then
            echo "::error::Unsupported tag format: $GITHUB_REF_NAME (expected vX.Y.Z or vX.Y.Z-ID)"
            exit 1
          else
            VERSION_FILE=$(cat VERSION.txt 2>/dev/null | tr -d '[:space:]')
            # Split like a tag: release PRs carry 9.3.6-rc.1 → version=9.3.6 build=0~rc.1
            if [[ "${VERSION_FILE}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([1-9][0-9]*)$ ]]; then
              echo "product_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
              echo "build_number=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            elif [[ "${VERSION_FILE}" =~ ^([^-]+)-(.+)$ ]]; then
              echo "product_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
              echo "build_number=0~${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            else
              echo "product_version=${VERSION_FILE}" >> $GITHUB_OUTPUT
              echo "build_number=${{ env.BUILD_NUMBER }}" >> $GITHUB_OUTPUT
            fi
          fi

  # ─────────────────────────────────────────────────────────────
  # BUILD (common / Linux / Docker / WASM)
  #
  # Produces the brand-specific editors web payload consumed by all
  # three platform jobs. One run per brand.
  # ─────────────────────────────────────────────────────────────


  # ─────────────────────────────────────────────────────────────
  # BRAND ASSETS
  #
  # Renders the brand SVGs into the icon/image tree once, on Linux, and
  # publishes it as an artifact. Each platform job untars it over its
  # checkout before building. Windows and macOS build natively
  # (build.ps1 / xcodebuild), not through Docker, so `COPY --from=brand-icons`
  # isn't available there — the artifact overlay is what lets one render
  # serve all three platforms.
  # ─────────────────────────────────────────────────────────────
  brand-assets:
    name: brand-assets (${{ matrix.brand.name }})
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write          # registry build cache only
    strategy:
      fail-fast: false
      matrix:
        brand:
          - name: euro-office
            extra_bake_files: ""
            cache_prefix: ""
            expect_assets: false          # dummy target: empty overlay by design
            # TODO(app icon): a brand-desktop.hcl overriding brand-icons goes here.
    steps:
      - name: Checkout DesktopEditors repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: .
          # The render container's context is the brand repo, not the monorepo,
          # so the multi-GB submodules are pure cost here.
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Render brand assets
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          workdir: ./build
          files: |
            ./docker-bake.hcl
            ${{ matrix.brand.extra_bake_files }}
          targets: brand-icons
          push: false
          set: |
            *.context=..
            brand-icons.tags=
            brand-icons.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}brand-icons-buildcache
            brand-icons.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}brand-icons-buildcache,mode=max
            brand-icons.output=type=local,dest=./brand-assets

      - name: Pack the overlay tree
        run: |
          set -euo pipefail
          OUT=build/brand-assets          # dest above is relative to workdir ./build
          mkdir -p "$OUT"

          # The euro-office dummy (FROM scratch + WORKDIR /keep) exports an empty
          # /keep; drop it so the overlay is a genuine no-op.
          rm -rf "$OUT/keep"

          echo "--- rendered overlay ---"
          find "$OUT" -type f -printf '%P\t%s bytes\n' | sort | tee /tmp/manifest.txt

          # Without this, a brand repo that renames its Dockerfile or drops an SVG
          # produces an empty overlay and every downstream job ships unbranded,
          # green. Fail loudly instead.
          if [ "${{ matrix.brand.expect_assets }}" = "true" ] && [ ! -s /tmp/manifest.txt ]; then
            echo "::error::brand-icons produced no files for ${{ matrix.brand.name }}"
            exit 1
          fi

          tar -czf brand-assets.tar.gz -C "$OUT" .

      - uses: actions/upload-artifact@v4
        with:
          name: brand-assets-${{ matrix.brand.name }}
          path: brand-assets.tar.gz
          if-no-files-found: error
          compression-level: 0          # already gzipped
          retention-days: 7

  build-common:
    name: build-common (${{ matrix.brand.name }})
    runs-on: 'ubuntu-latest'
    needs: [version, brand-assets]
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        brand:
          - name: euro-office
            image_name: desktop-common
            company_name: Euro-Office
            product_name: Euro-Office
            branding_dir: "."
            extra_bake_files_common: ""
            extra_targets_common: ""
            cache_prefix: ""
    steps:
      - name: Checkout fork repository (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: .
          submodules: recursive

      - name: Record build commits
        shell: bash
        run: |
          echo "BUILD_COMMITS=DesktopEditors=$(git rev-parse HEAD) $(git submodule foreach --quiet 'echo $name=$(git rev-parse HEAD)' | tr '\n' ' ')" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Debug workspace
        run: |
          echo "workspace: ${{ github.workspace }}"
          echo "brand:     ${{ matrix.brand.name }}"
          ls -la "${{ github.workspace }}"
          ls -la "${{ github.workspace }}/build" || echo "build/ MISSING"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: actions/cache@v4
        id: wasm-cache
        with:
          path: |
            wasm-ccache
            wasm-em-cache
          # Brand-scoped so the two brands don't evict each other's cache.
          key: ${{ runner.os }}-wasm-${{ matrix.brand.name }}-${{ hashFiles('core/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-wasm-${{ matrix.brand.name }}-
            ${{ runner.os }}-wasm-

      - uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "wasm-ccache": { "target": "/ccache", "id": "wasm-ccache" },
              "wasm-em-cache": { "target": "/em-cache", "id": "wasm-em-cache" }
            }
          skip-extraction: ${{ steps.wasm-cache.outputs.cache-hit }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: brand-assets-${{ matrix.brand.name }}
          path: brand-assets

      - name: Overlay brand assets onto the checkout
        shell: bash                    # Git Bash on the Windows runners
        run: tar -xzf brand-assets/brand-assets.tar.gz -C .

      - name: Build desktop-common
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          workdir: ./build
          # A brand bake file is appended when the brand defines one; empty
          # lines are filtered by bake-action so euro-office sees only the base.
          files: |
            ./docker-bake.hcl
            ${{ matrix.brand.extra_bake_files_common }}
          # extra_targets_common is either "" or "<target>," so the comma-joined
          # target list resolves correctly for both brands.
          targets: ${{ matrix.brand.extra_targets_common }}desktop-common
          # push=false here; per-target pushing is controlled via tags below.
          push: false
          set: |
            *.context=..
            core-wasm.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}core-wasm-buildcache
            core-wasm.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:main-${{ matrix.brand.cache_prefix }}core-wasm-buildcache
            core-wasm.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}core-wasm-buildcache,mode=max
            core-wasm.tags=
            sdkjs-desktop.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}sdkjs-desktop-buildcache
            sdkjs-desktop.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:main-${{ matrix.brand.cache_prefix }}sdkjs-desktop-buildcache
            sdkjs-desktop.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}sdkjs-desktop-buildcache,mode=max
            sdkjs-desktop.tags=
            desktop-js.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-js-buildcache
            desktop-js.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:main-${{ matrix.brand.cache_prefix }}desktop-js-buildcache
            desktop-js.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-js-buildcache,mode=max
            desktop-js.tags=
            web-apps.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}web-apps-buildcache
            web-apps.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:main-${{ matrix.brand.cache_prefix }}web-apps-buildcache
            web-apps.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}web-apps-buildcache,mode=max
            web-apps.tags=
            desktop-common.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-common-buildcache
            desktop-common.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:main-${{ matrix.brand.cache_prefix }}desktop-common-buildcache
            desktop-common.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-common-buildcache,mode=max
            desktop-common.tags=${{ format('{0}/{1}:{2}', env.REGISTRY, matrix.brand.image_name, needs.version.outputs.sha_short) }}
            desktop-common.output=type=tar,dest=./common.tar
        env:
          GIT_COMMIT: ${{ needs.version.outputs.sha_short }}
          REGISTRY: ${{ env.REGISTRY }}
          PRODUCT_VERSION: ${{ needs.version.outputs.product_version }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          BUILD_ROOT: ${{ env.BUILD_ROOT }}
          NUGET_CACHE: local
          # ---- branding ----
          BRANDING_DIR: ${{ matrix.brand.branding_dir }}
          COMPANY_NAME: ${{ matrix.brand.company_name }}
          PRODUCT_NAME: ${{ matrix.brand.product_name }}
          # ------------------

      - uses: actions/upload-artifact@v4
        with:
          name: common-files-${{ matrix.brand.name }}
          path: ./build/common.tar
          compression-level: 0
          retention-days: 1             # only consumed by the platform jobs of this run

  # ─────────────────────────────────────────────────────────────
  # 3RD-PARTY CROSS-COMPILE (brand independent)
  #
  # V8/OpenSSL for Windows arm64 contain no branding, so this job
  # deliberately stays outside the brand matrix and is shared.
  #
  # ensure_dep uses the public S3 remote cache (REMOTE_CACHE_TYPE=s3,
  # the default). Without REMOTE_CACHE_S3_* upload keys it is
  # download-only: a cache hit is fetched, a miss is built here and
  # not uploaded.
  # ─────────────────────────────────────────────────────────────
  crosscompile-3rdparty-arm64:
    runs-on: windows-2022 # x64 host that cross-compiles to arm64
    env:
      PYTHONUTF8: "1"
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0" # V8: use the locally installed VS, not Google's toolchain
    steps:
      - name: Checkout fork repository (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: .
          submodules: recursive

      # windows-2022 ships VS2022 but not always the ARM64 *target* tools.
      # clang-cl (V8) links arm64 against the arm64 Windows SDK libs;
      # cl.exe (OpenSSL) needs the amd64_arm64 toolset. Add both.
      - name: Add ARM64 build tools to Visual Studio
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $installPath = & $vsWhere -latest -products * -property installationPath
          & $vsInstaller modify `
            --installPath $installPath `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            --add Microsoft.VisualStudio.Component.VC.ATL.ARM64 `
            --add Microsoft.VisualStudio.Component.VC.MFC.ARM64 `
            --quiet --norestart --force
          if ($LASTEXITCODE -notin @(0, 3010)) {
            Write-Warning "vs_installer returned $LASTEXITCODE - components may already be present, continuing."
          }

      # Sets the amd64_arm64 cross environment for all later steps, incl.
      # VSCMD_ARG_TGT_ARCH=arm64 -- the single signal openssl, v8 and the
      # cache tag all key off of.
      - name: Set up arm64 cross MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Cross-compile arm64 third-party (V8, OpenSSL)
        shell: pwsh
        run: |
          python ${{ github.workspace }}\core\Common\3dParty\build_3rdparty.py `
            --only=v8,openssl `
            "${{ github.workspace }}\workdir" `
            "${{ github.workspace }}\installdir"

  # ─────────────────────────────────────────────────────────────
  # BUILD (Windows)
  #
  # arch × brand. build.ps1 takes -CompanyName / -ProductName; it has
  # no branding-dir overlay yet, so installer artwork still comes from
  # the upstream desktop-apps/win-linux/package tree. See the note at
  # the bottom of the accompanying summary.
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: build-windows (${{ matrix.arch }}, ${{ matrix.brand.name }})
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    needs: [version, build-common, crosscompile-3rdparty-arm64, brand-assets]
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        brand:
          - name: euro-office
            company_name: Euro-Office
            product_name: Euro-Office
            # On tags only a signing bundle here; signed + packaged by the
            # sign-windows job (build/windows/sign-package.ps1). Branch and
            # PR builds stay unsigned and are packaged here.
            sign: true
    env:
      PYTHONUTF8: "1"
      SCCACHE_GHA_ENABLED: "true"
      SIGN_BUNDLE: ${{ matrix.brand.sign && startsWith(github.ref, 'refs/tags/') }}
    steps:
      # ---- orchestration / environment setup (stays in the workflow) ---- #
      - name: Checkout fork repository (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: .
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: common-files-${{ matrix.brand.name }}
          path: . # lands as .\common.tar

      - name: Extract common
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\common | Out-Null
          tar -xf .\common.tar -C .\common   # bsdtar ships with windows-2022/arm runners

      # Install Cygwin WITHOUT touching PATH (the script does the PATH ordering).
      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v4
        with:
          install-dir: 'C:\cygwin64'
          add-to-path: false
          packages: >-
            automake
            cmake
            make
            git
            python3
            python3-devel

      - name: Install aqtinstall
        shell: pwsh
        run: python -m pip install --upgrade --break-system-packages aqtinstall

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10 # puts sccache on PATH + exports the cache tokens

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11 # exports VCPKG_ROOT for the script

      - uses: actions/download-artifact@v4
        with:
          name: brand-assets-${{ matrix.brand.name }}
          path: brand-assets

      - name: Overlay brand assets onto the checkout
        shell: bash                    # Git Bash on the Windows runners
        run: tar -xzf brand-assets/brand-assets.tar.gz -C .

      # ---- build + package (single source of truth: the script) ---- #
      - name: Build & package
        shell: pwsh
        run: |
          $extra = @{}
          if ($env:SIGN_BUNDLE -eq 'true') {
            # Packages must be built from signed binaries, so leave that to
            # the sign-windows job.
            $extra.SigningBundle = "${{ github.workspace }}\windows-signing-bundle.tar"
            $extra.SkipPackaging = $true
          }
          .\build\windows\build.ps1 @extra `
            -CommonDir "${{ github.workspace }}\common" `
            -ProductVersion "${{ needs.version.outputs.product_version }}" `
            -BuildNumber "${{ needs.version.outputs.build_number }}" `
            -Arch ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }} `
            -WinSdkVersion  ${{ matrix.arch == 'arm64' && '10.0.22621.0' || '10.0.19041.0' }} `
            -VcToolsVersion '${{ matrix.arch == 'arm64' && '14.44' || '' }}' `
            -Target standalone `
            -CompanyName "${{ matrix.brand.company_name }}" `
            -ProductName "${{ matrix.brand.product_name }}"

      # ---- collect outputs (stays in the workflow) ---- #
      - if: env.SIGN_BUNDLE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages-${{ matrix.brand.name }}-${{ matrix.arch }}
          path: |
            desktop-apps/package/zip/*-windows-*.zip
            desktop-apps/package/inno/*-windows-*.exe
            desktop-apps/package/advinst/*.msi
          # Kept longer on tags for the publish jobs and the manual signing.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 7 }}

      # Input for build/windows/sign-package.ps1 in the sign-windows job, which
      # signs the binaries and builds + signs the ZIP and Inno installer.
      - if: env.SIGN_BUNDLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-signing-bundle-${{ matrix.brand.name }}-${{ matrix.arch }}
          path: windows-signing-bundle.tar
          if-no-files-found: error
          # Kept longer on tags for the publish jobs and the manual signing.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 7 }}

  # ─────────────────────────────────────────────────────────────
  # SIGN (Windows) - tags only
  #
  # Signs the euro-office signing bundles with Azure Artifact Signing
  # (OIDC login, no stored certificate) and builds the signed ZIP and
  # Inno installer with build/windows/sign-package.ps1. Uploads them as
  # windows-packages-euro-office-<arch>, the artifact publish-release
  # picks up. Both arches sign on x64: the signing dlib is x64-only, so
  # arm64 builds keep no VLC plugin cache (see build/windows/README.md).
  # ─────────────────────────────────────────────────────────────
  sign-windows:
    name: sign-windows (${{ matrix.arch }})
    runs-on: windows-2022
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    environment: signing
    permissions:
      id-token: write          # azure/login OIDC
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    env:
      BRAND: euro-office
      SIGN_TOOLS: C:\ats       # short: the dlib path ends up in every signtool call
    steps:
      # Only sign-package.ps1 + packaging-helpers.ps1 are needed; the
      # packaging scripts come from the bundle.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          sparse-checkout: build/windows
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-signing-bundle-${{ env.BRAND }}-${{ matrix.arch }}
          path: bundle

      - name: Install signing and packaging tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\build\windows\packaging-helpers.ps1

          # The Artifact Signing dlib runs on .NET 8.
          $runtimes = dotnet --list-runtimes
          if (-not ($runtimes -match '^Microsoft\.NETCore\.App 8\.')) {
            throw ".NET 8 runtime not found on the runner:`n$($runtimes -join "`n")"
          }

          nuget install Microsoft.ArtifactSigning.Client -Version $env:ARTIFACT_SIGNING_CLIENT_VERSION `
            -OutputDirectory $env:SIGN_TOOLS -ExcludeVersion -NonInteractive
          Assert-LastExit "nuget install"
          $dlib = Get-ChildItem $env:SIGN_TOOLS -Recurse -Filter Azure.CodeSigning.Dlib.dll |
                  Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $dlib) { throw "x64 Azure.CodeSigning.Dlib.dll not found under $env:SIGN_TOOLS." }

          $metadata = Join-Path $env:SIGN_TOOLS 'metadata.json'
          [ordered]@{
            Endpoint               = $env:ARTIFACT_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:ARTIFACT_SIGNING_ACCOUNT
            CertificateProfileName = $env:ARTIFACT_SIGNING_PROFILE
          } | ConvertTo-Json | Set-Content -Encoding ASCII $metadata
          Get-Content $metadata

          "SIGN_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          "SIGN_METADATA=$metadata"     >> $env:GITHUB_ENV

          # Same packaging tools build.ps1 -InstallDeps installs; the runner
          # image normally ships both.
          if (-not (Get-InnoRoot '')) { choco install innosetup --version=6.2.2 -y --no-progress }
          if (-not (Test-Path 'C:\Program Files\7-Zip\7z.exe')) { choco install 7zip -y --no-progress }

      # Last step before signing: az caches the access token below, but the
      # OIDC assertion it logs in with expires within minutes.
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch the code signing token
        shell: pwsh
        run: az account get-access-token --resource https://codesigning.azure.net --output none

      - name: Sign + package (sign-package.ps1)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}   # Sync-InnoLanguages API call
        run: |
          .\build\windows\sign-package.ps1 `
            -BundlePath .\bundle `
            -Brand $env:BRAND `
            -OutDir "${{ github.workspace }}\signed" `
            -SignArgs @('/fd', 'SHA256', '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256',
                        '/dlib', $env:SIGN_DLIB, '/dmdf', $env:SIGN_METADATA)

      # Flat, like the unsigned windows-packages artifact, so publish-release
      # can upload dist/* as-is. Checksums are per arch to avoid a name clash.
      - name: Collect signed packages
        shell: pwsh
        run: |
          $dist = New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem signed -Recurse -File -Include *.zip, *.exe | Copy-Item -Destination $dist
          $sums = Get-ChildItem $dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name
          }
          Set-Content -Encoding ASCII (Join-Path $dist 'SHA256SUMS-windows-${{ matrix.arch }}.txt') $sums
          Get-ChildItem $dist | Format-Table Name, Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-packages-${{ env.BRAND }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # BUILD (Linux)
  #
  # arch × brand. This is where the branding overlay actually bites:
  # packages.bake.Dockerfile does
  #   COPY ${BRANDING_DIR}/desktop-apps/package/ /desktop-editors-package/
  # on top of the upstream packaging tree, and COMPANY_NAME_LOW decides
  # the .deb/.rpm names.
  # ─────────────────────────────────────────────────────────────
  build-linux:
    name: build-linux (${{ matrix.arch }}, ${{ matrix.brand.name }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: [version, build-common, brand-assets]
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        brand:
          - name: euro-office
            company_name: Euro-Office
            product_name: Euro-Office
            publisher_name: Euro-Office
            publisher_url: https://github.com/Euro-Office/DesktopEditors
            branding_dir: "."
            extra_bake_files_linux: ""
            extra_targets_linux: ""
            cache_prefix: ""
    steps:
      - name: Checkout fork repository (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: .
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: common-files-${{ matrix.brand.name }}
          path: ./build/linux

      - name: Extract common
        run: |
          mkdir -p ./build/linux/common
          tar -xf ./build/linux/common.tar -C ./build/linux/common

      - name: Debug workspace
        run: |
          echo "workspace: ${{ github.workspace }}"
          echo "brand:     ${{ matrix.brand.name }}"
          ls -la "${{ github.workspace }}"
          ls -la "${{ github.workspace }}/build" || echo "build/ MISSING"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Restore desktop build caches
        uses: actions/cache@v4
        id: desktop-cache
        with:
          path: |
            ccache
            nuget-cache
          key: ${{ runner.os }}-desktop-${{ matrix.brand.name }}-${{ matrix.arch }}-${{ hashFiles('core/vcpkg.json', 'desktop-apps/win-linux/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-desktop-${{ matrix.brand.name }}-${{ matrix.arch }}-
            ${{ runner.os }}-desktop-

      - name: Inject caches into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "ccache": { "target": "/ccache", "id": "ccache" },
              "nuget-cache": { "target": "/nuget-cache", "id": "nuget-cache" }
            }
          skip-extraction: ${{ steps.desktop-cache.outputs.cache-hit }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: brand-assets-${{ matrix.brand.name }}
          path: brand-assets

      - name: Overlay brand assets onto the checkout
        shell: bash                    # Git Bash on the Windows runners
        run: tar -xzf brand-assets/brand-assets.tar.gz -C .


      - name: Build packages
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          workdir: ./build/linux
          files: |
            ./docker-bake.hcl
            ${{ matrix.brand.extra_bake_files_linux }}
          targets: ${{ matrix.brand.extra_targets_linux }}packages
          push: false
          set: |
            *.context=../..
            core-base.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}core-base-buildcache
            core-base.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:main-${{ matrix.brand.cache_prefix }}core-base-buildcache
            core-base.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}core-base-buildcache,mode=max
            core-base.tags=
            desktop-linux.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-linux-buildcache
            desktop-linux.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:main-${{ matrix.brand.cache_prefix }}desktop-linux-buildcache
            desktop-linux.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}desktop-linux-buildcache,mode=max
            desktop-linux.tags=
            desktop-linux.contexts.desktop-common=./common
            packages.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}packages-buildcache
            packages.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:main-${{ matrix.brand.cache_prefix }}packages-buildcache
            packages.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ needs.version.outputs.ref_name }}-${{ matrix.brand.cache_prefix }}packages-buildcache,mode=max
            packages.tags=
        env:
          GIT_COMMIT: ${{ needs.version.outputs.sha_short }}
          REGISTRY: ${{ env.REGISTRY }}
          PRODUCT_VERSION: ${{ needs.version.outputs.product_version }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          BUILD_ROOT: ${{ env.BUILD_ROOT }}
          NUGET_CACHE: local
          # ---- branding ----
          BRANDING_DIR: ${{ matrix.brand.branding_dir }}
          COMPANY_NAME: ${{ matrix.brand.company_name }}
          PRODUCT_NAME: ${{ matrix.brand.product_name }}
          PUBLISHER_NAME: ${{ matrix.brand.publisher_name }}
          PUBLISHER_URL: ${{ matrix.brand.publisher_url }}
          # ------------------

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.brand.name }}-${{ matrix.arch }}
          path: |
            build/linux/deploy/packages/*.deb
            build/linux/deploy/packages/*.rpm
            build/linux/deploy/packages/*.tar.xz
          # Kept longer on tags for the publish jobs and the manual signing.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 7 }}

  # ─────────────────────────────────────────────────────────────
  # BUILD (macOS)
  #
  # Apple Silicon only (no Intel/universal). Runs on the same triggers
  # as build-windows/build-linux (pull_request + workflow_dispatch, see
  # the top-level `on:` above) - proven green via manual dispatch first,
  # with the 3rd-party/ccache caches below confirmed to actually hit on
  # a second run, before being trusted on every PR.
  #
  # NOTE: unlike Linux and Windows, macOS uses a single Xcode project
  # (Euro-Office.xcodeproj) for every brand - there's no separate
  # project/scheme per brand. PRODUCT_NAME/PRODUCT_BUNDLE_IDENTIFIER
  # are overridden per-brand directly on the xcodebuild command line, and
  # copyright/CFBundleName text + icons are patched by apply-branding.sh /
  # regenerate-branding-assets.sh before the build (both ephemeral, not
  # committed - same non-committed spirit as Windows/Linux's icon overlay,
  # just done locally here instead of through the shared brand-assets job).
  # ─────────────────────────────────────────────────────────────
  build-macos:
    name: build-macos (${{ matrix.brand.name }})
    # NOTE: confirm this is still GitHub's current Apple Silicon runner
    # label before relying on it - these change over time.
    runs-on: macos-14
    needs: [version, build-common]
    strategy:
      fail-fast: false
      matrix:
        brand:
          # There is only one Xcode project - xcode_project/xcode_scheme stay
          # the same for every brand. Only the branded, build-time-overridden
          # settings (app_bundle/package_name/company_name/product_name/bundle_id)
          # and the icon source SVGs differ per row. Empty icon SVG fields
          # mean "use regenerate-branding-assets.sh's own committed defaults".
          - name: euro-office
            xcode_project: desktop-apps/macos/Euro-Office.xcodeproj
            xcode_scheme: Euro-Office-arm
            app_bundle: Euro-Office.app
            package_name: Euro-Office-DesktopEditors
            company_name: Euro-Office
            product_name: Euro-Office
            bundle_id: asc.euro-office.Euro-Office
            app_icon_svg: ""
            tab_icon_light_svg: ""
            tab_icon_dark_svg: ""
    env:
      REPO: ${{ github.workspace }}
      EO_3RDPARTY: /Users/runner/eo-3rdparty
      STAGE: ${{ github.workspace }}/macos-stage
      SDK_BUILD_DIR: ${{ github.workspace }}/build-mac-sdk
      CCACHE_DIR: /Users/runner/.ccache
      DMG_PATH: build/macos/out/${{ matrix.brand.package_name }}-${{ needs.version.outputs.product_version }}-${{ needs.version.outputs.build_number }}-macos-arm64.dmg
    steps:
      - name: Checkout fork repository (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: .
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: common-files-${{ matrix.brand.name }}
          path: . # lands as ./common.tar

      - name: Extract common payload
        run: |
          mkdir -p build/deploy/common
          tar -xf common.tar -C build/deploy/common

      - name: Install Homebrew build prerequisites
        run: brew install ninja autoconf automake libtool pkg-config ccache

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11 # same action build-windows uses; exports VCPKG_ROOT

      # Brand-independent (3rd-party deps carry no branding), so the cache key
      # deliberately does NOT include the brand.
      - name: Restore 3rd-party dependency cache
        uses: actions/cache@v4
        id: thirdparty-cache
        with:
          path: ${{ env.EO_3RDPARTY }}
          key: ${{ runner.os }}-eo-3rdparty-${{ hashFiles('core/Common/3dParty/**/nc-build.py') }}
          restore-keys: |
            ${{ runner.os }}-eo-3rdparty-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-macos-ccache-${{ matrix.brand.name }}-${{ hashFiles('core/**/CMakeLists.txt', 'desktop-sdk/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-macos-ccache-${{ matrix.brand.name }}-
            ${{ runner.os }}-macos-ccache-

      # ---- build + stage + package ---- #
      - name: Build desktop-sdk
        run: |
          cmake -S "${REPO}/desktop-sdk/ChromiumBasedEditors/lib" -B "${SDK_BUILD_DIR}" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_DESKTOP=1 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DVCPKG_MANIFEST_MODE=ON \
            -DVCPKG_MANIFEST_DIR="${REPO}/core" \
            -DEO_CORE_3RD_PARTY_DIR="${EO_3RDPARTY}" \
            -DEO_CORE_OUTPUT_DIR="${STAGE}/converter"
          cmake --build "${SDK_BUILD_DIR}"

      - name: Stage the build
        run: |
          ./build/macos/stage.sh \
            --stage-dir "${STAGE}" \
            --3rdparty-dir "${EO_3RDPARTY}"

      # ---- brand the build output ---- #
      - name: Regenerate icons for this brand
        run: |
          args=()
          if [ -n "${{ matrix.brand.app_icon_svg }}" ]; then
            args+=(
              --app-icon-svg "${{ matrix.brand.app_icon_svg }}"
              --tab-icon-light-svg "${{ matrix.brand.tab_icon_light_svg }}"
              --tab-icon-dark-svg "${{ matrix.brand.tab_icon_dark_svg }}"
            )
          fi
          ./desktop-apps/macos/regenerate-branding-assets.sh "${args[@]}"

      - name: Apply branding (copyright/bundle name text)
        run: |
          ./desktop-apps/macos/apply-branding.sh \
            --company-name "${{ matrix.brand.company_name }}" \
            --product-name "${{ matrix.brand.product_name }}" \
            --version "${{ needs.version.outputs.product_version }}"

      - name: Build the Xcode project
        run: |
          xcodebuild -project "${{ matrix.brand.xcode_project }}" \
            -scheme "${{ matrix.brand.xcode_scheme }}" -configuration Release \
            EO_MAC_STAGE_DIR="${STAGE}" \
            CONFIGURATION_BUILD_DIR="${REPO}/build/macos/out" \
            PRODUCT_NAME="${{ matrix.brand.product_name }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ matrix.brand.bundle_id }}" \
            build

      - name: Build the DMG installer
        run: |
          ./build/macos/make-dmg.sh \
            --app "build/macos/out/${{ matrix.brand.app_bundle }}" \
            --output "$DMG_PATH" \
            --title "${{ matrix.brand.product_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages-${{ matrix.brand.name }}-arm64
          path: ${{ env.DMG_PATH }}
          # Kept longer on tags for the publish jobs and the manual signing.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 7 }}

  # ─────────────────────────────────────────────────────────────
  # Points release/v* PRs (opened by Euro-Office/release) to the test
  # build's artifacts. Edits its previous comment on re-runs.
  # ─────────────────────────────────────────────────────────────
  pr-comment:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') }}
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Comment with artifact links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | [.name, .id, .size_in_bytes] | @tsv')
          declare -A url size
          while IFS=$'\t' read -r name id bytes; do
            [ -n "$name" ] || continue
            url[$name]="$RUN_URL/artifacts/$id"
            size[$name]=$(awk -v b="$bytes" 'BEGIN { printf "%.1f GB", b / 1073741824 }')
          done <<<"$artifacts"
          cell() { if [ -n "${url[$1]:-}" ]; then echo "[${size[$1]}](${url[$1]})"; else echo "–"; fi; }

          # One table per brand: a row per artifact kind, a column per arch.
          {
            echo "Test build for $SHA ([run]($RUN_URL), artifacts kept 7 days)"
            for brand in "euro-office:Euro-Office"; do
              rows=""
              for kind in "linux-packages:Linux (.deb, .rpm, .tar.xz)" "windows-packages:Windows (.exe, .zip)" \
                          "windows-signing-bundle:Windows signing bundle" "macos-packages:macOS (.dmg)"; do
                amd64="${kind%%:*}-${brand%%:*}-amd64" arm64="${kind%%:*}-${brand%%:*}-arm64"
                [ -n "${url[$amd64]:-}${url[$arm64]:-}" ] || continue
                rows+="| ${kind#*:} | $(cell "$amd64") | $(cell "$arm64") |"$'\n'
              done
              [ -z "$rows" ] || printf '\n### %s\n\n| | amd64 | arm64 |\n|---|---|---|\n%s' "${brand#*:}" "$rows"
            done
          } > comment.md
          grep -q '^###' comment.md || printf '\nNo packages were uploaded, see the run.\n' >> comment.md
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file comment.md

  # ─────────────────────────────────────────────────────────────
  # Classify the tag: v9.3.4 and its patch builds (v9.3.4-1) are stable;
  # anything else (v9.3.4-beta.1, v9.3.4-rc.1, ...) is a prerelease.
  # ─────────────────────────────────────────────────────────────
  release-info:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      stable: ${{ steps.check.outputs.stable }}
    steps:
      - id: check
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[1-9][0-9]*)?$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────
  # PUBLISH - euro-office to GitHub Release (this repository)
  #
  # Windows packages are the signed ones from sign-windows; Linux and
  # macOS are unsigned for now.
  # TODO(signing): macOS (Apple notarization) and Linux (GPG) signing.
  # ─────────────────────────────────────────────────────────────
  publish-release:
    runs-on: ubuntu-latest
    needs: [release-info, build-linux, sign-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-packages-euro-office-*'
          path: dist
          merge-multiple: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          path: src
          persist-credentials: false

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: Euro-Office Desktop Editors ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PRERELEASE: ${{ needs.release-info.outputs.stable != 'true' }}
          LATEST: ${{ needs.release-info.outputs.stable == 'true' }}
        run: |
          set -euo pipefail
          # The CHANGELOG.md section of this tag, written by Euro-Office/release.
          awk -v h="## $GITHUB_REF_NAME" '$0 == h { f = 1; next } f && /^## / { exit } f' src/CHANGELOG.md > notes.md
          printf '\nBuilt from %s@%s, %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$RUN_URL" >> notes.md
          flags=(--title "$TITLE" --notes-file notes.md --prerelease="$PRERELEASE" --latest="$LATEST")
          # Re-runs update the existing release and replace its assets.
          if gh release view "$GITHUB_REF_NAME" -R "$REPO" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" -R "$REPO" "${flags[@]}"
            gh release upload "$GITHUB_REF_NAME" -R "$REPO" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" -R "$REPO" "${flags[@]}" dist/*
          fi
