name: Update submodules to latest main branch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  update-submodules:
    # Upstream only: the called workflow needs Euro-Office's self-hosted runner and token.
    if: github.repository_owner == 'Euro-Office'
    permissions:
      contents: write
      pull-requests: write
    uses: Euro-Office/DocumentServer/.github/workflows/update-submodules.yml@main
    secrets: inherit
